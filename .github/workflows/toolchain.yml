name: offline-toolchain
on:
  push:
    paths: ['.github/workflows/toolchain.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.100'
      - name: Package pinned SDK for offline compiler development
        shell: bash
        run: |
          mkdir -p toolchain
          curl --fail --location --retry 3 https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.100/dotnet-sdk-10.0.100-linux-x64.tar.gz --output toolchain/dotnet-sdk-10.0.100-linux-x64.tar.gz
          sha256sum toolchain/*.tar.gz > toolchain/SHA256SUMS
          dotnet --info > toolchain/environment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: offline-dotnet-sdk-linux-x64
          path: toolchain/
          compression-level: 0
          retention-days: 7
