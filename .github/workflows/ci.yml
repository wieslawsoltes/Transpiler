name: compiler-conformance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clock-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build
        run: dotnet build Transpiler.slnx -c Release
      - name: Native clock lifecycle invariants
        run: |
          node tests/timers/clock_unit.mjs
          python tests/timers/clock_unit.py
      - name: Compiled timer ownership and async cleanup
        env:
          TRANSPILER_TEST_FILTER: 'host/timers/'
          TRANSPILER_TEST_WORKERS: '2'
        run: python tests/conformance.py
      - name: Duration, provider, timeout and periodic timer contracts
        env:
          TRANSPILER_TEST_FILTER: 'host/time-services/'
          TRANSPILER_TEST_WORKERS: '2'
        run: |
          cp artifacts/conformance/report.json artifacts/conformance/clock-report.json
          python tests/conformance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transpiler-host-clock-regressions
          path: artifacts/conformance/
          if-no-files-found: warn
  stream-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build
        run: dotnet build Transpiler.slnx -c Release
      - name: Bounded stream contract discovery
        run: dotnet tests/CompilerChecks/bin/Release/net10.0/CompilerChecks.dll --streams
      - name: Factory acquisition and disposal ownership
        env:
          TRANSPILER_TEST_FILTER: 'interop/stream-exports/'
          TRANSPILER_TEST_WORKERS: '2'
        run: python tests/conformance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transpiler-stream-export-regressions
          path: artifacts/conformance/
          if-no-files-found: warn
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Native compiler inventory
        run: |
          g++ --version
          clang++ --version
      - name: Build
        run: dotnet build Transpiler.slnx -c Release
      - name: Differential conformance
        env:
          TRANSPILER_TEST_FILTER: ''
          TRANSPILER_TEST_WORKERS: '2'
        run: python tests/conformance.py
      - name: Preserve binary redistribution notices
        run: |
          DEST=src/Transpiler.Cli/bin/Release/net10.0/licenses
          mkdir -p "$DEST"
          cp "$DOTNET_ROOT/LICENSE.txt" "$DEST/dotnet-sdk-LICENSE.txt"
          cp "$DOTNET_ROOT/ThirdPartyNotices.txt" "$DEST/dotnet-sdk-ThirdPartyNotices.txt"
          cp THIRD-PARTY-NOTICES.md "$DEST/Transpiler-THIRD-PARTY-NOTICES.md"
          cp src/Transpiler.Backends/Runtime/NOTICE.txt "$DEST/dotnet-runtime-LICENSE.txt"
      - name: Package source snapshot
        if: always()
        run: |
          mkdir -p artifacts
          git archive --format=zip --output=artifacts/transpiler-source.zip HEAD
      - name: Upload compiler and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transpiler-build-and-conformance
          path: |
            src/Transpiler.Cli/bin/Release/net10.0/
            artifacts/
          if-no-files-found: error
