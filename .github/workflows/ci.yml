name: compiler-conformance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build
        run: dotnet build Transpiler.slnx -c Release
      - name: Differential conformance
        run: python tests/conformance.py
      - name: Package source snapshot
        if: always()
        run: |
          mkdir -p artifacts
          git archive --format=zip --output=artifacts/transpiler-source.zip HEAD
      - name: Upload compiler and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transpiler-build-and-conformance
          path: |
            src/Transpiler.Cli/bin/Release/net10.0/
            artifacts/
          if-no-files-found: error
